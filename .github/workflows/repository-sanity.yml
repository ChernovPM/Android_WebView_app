name: Repository sanity checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify key project files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f AndroidManifest
          test -f activity_main
          test -f webView

      - name: Validate README sections
        run: |
          grep -q '^## Overview' README.md
          grep -q '^## Features' README.md
          grep -q '^## Tech Stack' README.md
          grep -q '^## Project Status' README.md
          grep -q '^## How to Run' README.md
          grep -q '^## Notes' README.md
